[package]
name = "gugu"
version = "0.1.0"
edition = "2021"
description = "gugu 咕咕 — lightweight QQ chat client (Slint, software renderer)"

[dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[build-dependencies]
slint-build = "1.17"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
